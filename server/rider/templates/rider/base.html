<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F4">
<link rel="icon" href="data:,">
<title>{% block title %}xLLM · Rider{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/reset.css') }}">
<link rel="stylesheet" href="{{ url_for('rider.static', filename='css/rider.css') }}">
</head>
<body class="r-page" data-page="{% block page_name %}{{ page|default('') }}{% endblock %}"{% block body_attrs %}{% endblock %}>
<div class="r-shell">

  {% block chrome %}
  <header class="r-appbar">
    <a class="r-brand" href="{{ url_for('rider.workbench') }}">xLLM<span class="r-brand__sub">Rider</span></a>
    <a class="r-iconlink" href="{{ url_for('rider.settings_page') }}" aria-label="Open rider settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="3.6"/><path d="M4.5 20.5c.8-3.7 3.8-5.5 7.5-5.5s6.7 1.8 7.5 5.5"/>
      </svg>
    </a>
  </header>

  {% if page is defined and page in ('workbench', 'history', 'settings') %}
  <nav class="r-nav" aria-label="Rider sections">
    <a class="r-nav__item{% if page == 'workbench' %} is-active{% endif %}" href="{{ url_for('rider.workbench') }}"{% if page == 'workbench' %} aria-current="page"{% endif %}>Workbench</a>
    <a class="r-nav__item{% if page == 'history' %} is-active{% endif %}" href="{{ url_for('rider.history_page') }}"{% if page == 'history' %} aria-current="page"{% endif %}>History</a>
    <a class="r-nav__item{% if page == 'settings' %} is-active{% endif %}" href="{{ url_for('rider.settings_page') }}"{% if page == 'settings' %} aria-current="page"{% endif %}>Settings</a>
  </nav>
  {% endif %}
  {% endblock %}

  {% block content %}{% endblock %}

  <p class="r-foot">xLLM Rider · one order at a time, done right</p>
</div>

<div class="r-toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

<script src="{{ url_for('rider.static', filename='js/rider.js') }}" defer></script>
</body>
</html>
