# =============================================================================
#  三个子域名 —— 每个端一个独立域名
#
#      customer.xllm.cloud      顾客端   → /customer/
#      restaurant.xllm.cloud    商家端   → /merchant/
#      delivery.xllm.cloud      骑手端   → /rider/
#      xllm.cloud               官网 + 管理大屏（另一个文件，不变）
#
#  装法见 tools/install-tls.sh；手工装的话：
#      sudo cp deploy/nginx/xllm-subdomains.conf /etc/nginx/sites-available/
#      sudo cp deploy/nginx/snippets/*.conf        /etc/nginx/snippets/
#      sudo ln -s /etc/nginx/sites-available/xllm-subdomains /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#
#  ⚠️ 证书是三张【单域名】DV 证书，一个域名一个文件，不能共用。
#     所以才需要三个 server 块：nginx 的 ssl_certificate 不能按 $host 变
#     （1.15.9 起技术上可以，但每次握手都要重新加载文件，得不偿失）。
#     想省事就去申请一张通配符证书 *.xllm.cloud，那样一个块就够。
#
#  ⚠️ 域名解析：四条 A 记录都指向本机。这里只管收 HTTPS，
#     哪个域名落在哪个端由 Flask 的 shared/hosts.py 决定 —— 见该文件顶部说明。
# =============================================================================

# ---------- HTTP：三个域名统一跳 HTTPS ----------
# server_name 可以列多个，因为跳转用的是 $host，不需要分开写。
server {
    listen      80;
    listen      [::]:80;
    server_name customer.xllm.cloud restaurant.xllm.cloud delivery.xllm.cloud;

    # 保留 ACME 验证通道，以后换证书不用再改配置
    location /.well-known/acme-challenge/ {
        root /var/www/xllm.cloud;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# =============================================================================
#  顾客端
# =============================================================================
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name customer.xllm.cloud;

    ssl_certificate     /etc/nginx/ssl/customer.xllm.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/customer.xllm.cloud/privkey.key;
    include /etc/nginx/snippets/xllm-tls.conf;

    access_log /var/log/nginx/customer.xllm.cloud.access.log;
    error_log  /var/log/nginx/customer.xllm.cloud.error.log;

    location / {
        include /etc/nginx/snippets/xllm-proxy.conf;
    }
}


# =============================================================================
#  商家端
# =============================================================================
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name restaurant.xllm.cloud;

    ssl_certificate     /etc/nginx/ssl/restaurant.xllm.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/restaurant.xllm.cloud/privkey.key;
