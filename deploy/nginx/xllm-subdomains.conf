}


# =============================================================================
#  骑手端
# =============================================================================
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name delivery.xllm.cloud;

    ssl_certificate     /etc/nginx/ssl/delivery.xllm.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/delivery.xllm.cloud/privkey.key;
